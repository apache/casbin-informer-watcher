apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: casbinpolicies.casbin.org
spec:
  group: casbin.org
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - ptype
                - rule
              properties:
                ptype:
                  type: string
                  description: Policy type (p, p2, g, g2, etc.)
                rule:
                  type: array
                  description: Policy rule as a list of strings
                  items:
                    type: string
            status:
              type: object
              properties:
                synced:
                  type: boolean
                  description: Whether this policy has been synced to enforcers
                lastSyncTime:
                  type: string
                  format: date-time
                  description: Timestamp of the last successful sync
                message:
                  type: string
                  description: Status message
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: PType
          type: string
          jsonPath: .spec.ptype
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: casbinpolicies
    singular: casbinpolicy
    kind: CasbinPolicy
    shortNames:
      - cbp
